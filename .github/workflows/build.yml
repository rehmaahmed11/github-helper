name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK preinstalled at ANDROID_HOME with
      # platform 34 and build-tools 34.0.0 already present, so nothing needs
      # downloading. android-actions/setup-android@v3 fails on current runner
      # images, and sdkmanager is not on PATH here either - hence a plain check.
      - name: Check Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $sdk"
          test -d "$sdk/platforms/android-34" || { echo "::error::platforms;android-34 is missing"; exit 1; }
          test -d "$sdk/build-tools/34.0.0" || { echo "::error::build-tools;34.0.0 is missing"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # No-op when the exec bit survives checkout, but keeps the job honest:
      # if gradlew were ever dropped from the repo, fail here with a clear
      # message instead of a confusing "No such file or directory" from Gradle.
      - name: Ensure gradlew is present and executable
        run: |
          test -f ./gradlew || { echo "::error::gradlew is missing from the repo."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar is missing."; exit 1; }
          chmod +x ./gradlew

      # Gradle's console output is not visible in every environment (job logs and
      # artifacts may be unreachable), so on failure the interesting lines are
      # re-published as workflow commands, which surface as check annotations.
      - name: Build debug APK
        run: |
          log="$RUNNER_TEMP/assembleDebug.log"
          if ./gradlew assembleDebug --stacktrace > "$log" 2>&1; then
            tail -n 15 "$log"
          else
            echo "::error title=assembleDebug::assembleDebug FAILED - see annotations below"
            grep -E "^e: |What went wrong|^Execution failed|^FAILURE:|^Caused by:|FAILED|error:|Could not|^> " "$log" \
              | tail -45 | while IFS= read -r line; do
              echo "::error title=assembleDebug::${line}"
            done
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Lint
        run: |
          log="$RUNNER_TEMP/lintDebug.log"
          if ./gradlew lintDebug --stacktrace > "$log" 2>&1; then
            tail -n 15 "$log"
          else
            echo "::error title=lintDebug::lintDebug FAILED - see annotations below"
            grep -E "^e: |What went wrong|^Execution failed|^FAILURE:|^Caused by:|FAILED|error:|Lint found|^Error:|^[0-9]+ errors" "$log" \
              | tail -45 | while IFS= read -r line; do
              echo "::error title=lintDebug::${line}"
            done
            exit 1
          fi

      # Always published so a red build can be diagnosed from the artifacts
      # alone, without digging through the job log.
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            ${{ runner.temp }}/assembleDebug.log
            ${{ runner.temp }}/lintDebug.log
            app/build/reports/lint-results-*
          if-no-files-found: ignore