name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK with ANDROID_HOME set. This step just
      # makes sure the licences are accepted and the exact platform/build-tools
      # this app compiles against are present.
      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "::notice title=AndroidSDK::ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "::notice title=AndroidSDK::ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "::notice title=AndroidSDK::sdkmanager_on_path=$(command -v sdkmanager || echo NOT_FOUND)"
          echo "::notice title=AndroidSDK::resolved=${SDK:-<unset>}"
          echo "::notice title=AndroidSDK::sdk_contents=$(ls "$SDK" 2>/dev/null | tr '\n' ',' )"
          echo "::notice title=AndroidSDK::cmdline_tools=$(ls "$SDK/cmdline-tools" 2>/dev/null | tr '\n' ',')"
          echo "::notice title=AndroidSDK::platforms=$(ls "$SDK/platforms" 2>/dev/null | tr '\n' ',')"
          echo "::notice title=AndroidSDK::build_tools=$(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ',')"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # No-op when the exec bit survives checkout, but keeps the job honest:
      # if gradlew were ever dropped from the repo, fail here with a clear
      # message instead of a confusing "No such file or directory" from Gradle.
      - name: Ensure gradlew is present and executable
        run: |
          test -f ./gradlew || { echo "::error::gradlew is missing from the repo."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar is missing."; exit 1; }
          chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error