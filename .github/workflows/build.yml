name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK with ANDROID_HOME set, so
      # there is nothing to download. android-actions/setup-android@v3 is a
      # Node 20 action that fails on current runner images before Gradle is
      # ever reached; the only thing missing is the licence acceptance AGP
      # checks for, plus the exact platform/build-tools this app compiles with.
      - name: Setup Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # No-op when the exec bit survives checkout, but keeps the job honest:
      # if gradlew were ever dropped from the repo, fail here with a clear
      # message instead of a confusing "No such file or directory" from Gradle.
      - name: Ensure gradlew is present and executable
        run: |
          test -f ./gradlew || { echo "::error::gradlew is missing from the repo."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar is missing."; exit 1; }
          chmod +x ./gradlew

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error