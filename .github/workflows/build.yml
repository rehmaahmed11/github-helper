name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The rolling debug release below uploads an asset; without this the token is
    # read-only and the upload answers 403 - the same trap this repo's app keeps
    # having to explain to its users.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK preinstalled at ANDROID_HOME with
      # platform 34 and build-tools 34.0.0 already present, so nothing needs
      # downloading. android-actions/setup-android@v3 fails on current runner
      # images, and sdkmanager is not on PATH here either - hence a plain check.
      - name: Check Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $sdk"
          test -d "$sdk/platforms/android-34" || { echo "::error::platforms;android-34 is missing"; exit 1; }
          test -d "$sdk/build-tools/34.0.0" || { echo "::error::build-tools;34.0.0 is missing"; exit 1; }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # No-op when the exec bit survives checkout, but keeps the job honest:
      # if gradlew were ever dropped from the repo, fail here with a clear
      # message instead of a confusing "No such file or directory" from Gradle.
      - name: Ensure gradlew is present and executable
        run: |
          test -f ./gradlew || { echo "::error::gradlew is missing from the repo."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar is missing."; exit 1; }
          chmod +x ./gradlew

      # Gradle's console output is not visible in every environment (job logs and
      # artifacts may be unreachable), so on failure the "What went wrong" block
      # is re-published as workflow commands, which surface as check annotations.
      - name: Build debug APK
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
        run: |
          log="$RUNNER_TEMP/assembleDebug.log"
          if ./gradlew assembleDebug --stacktrace > "$log" 2>&1; then
            tail -n 15 "$log"
          else
            echo "::error title=assembleDebug::assembleDebug FAILED"
            {
              first=$(grep -n -m1 -E "^e: |^w: " "$log" | cut -d: -f1)
              [ -n "$first" ] && sed -n "${first},$((first + 45))p" "$log"
              banner=$(grep -n -m1 -E "What went wrong|^FAILURE:" "$log" | cut -d: -f1)
              [ -n "$banner" ] && sed -n "${banner},$((banner + 12))p" "$log"
            } | grep -v '^[[:space:]]*$' | head -50 | while IFS= read -r line; do
              echo "::error title=assembleDebug::${line}"
            done
            exit 1
          fi

      # Keep CI usable for forked PRs where Actions secrets are unavailable.
      # The app still builds without credentials; users then enter their own
      # OAuth credentials in the app or sign in with a personal access token.
      - name: Report OAuth configuration
        run: |
          f=$(find app/build/generated -name 'BuildConfig.java' | head -1)
          if [ -z "$f" ]; then
            echo "::error title=build-config::No generated BuildConfig.java found."
            exit 1
          fi
          grep -E 'String GITHUB_CLIENT_ID|String GITHUB_REDIRECT_URI' "$f"
          if grep -Fq 'GITHUB_CLIENT_ID = ""' "$f" || grep -Fq 'GITHUB_CLIENT_SECRET = ""' "$f"; then
            echo "::warning title=oauth-config::GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET Actions secrets are not set; the APK will ask the user for OAuth credentials or a personal access token at sign-in."
          else
            echo "Both OAuth credentials are configured (Client Secret not printed)."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts expire and need the Actions UI to reach, which is a poor way to
      # hand someone an APK. A fixed prerelease ("apk-debug") with a stable asset name gives
      # one tappable link that always points at the newest main build. continue-on-error keeps
      # a permission problem on the runner from turning a green build red.
      - name: Publish debug APK to the rolling prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "::error title=release::no APK to publish"; exit 1; fi
          cp "$apk" GitHubHelper-debug.apk
          notes="Debug build of the current main (${{ github.sha }}), rebuilt on every push.

          To install: download the .apk, allow 'install unknown apps' for the browser or
          file manager you used, open the file. It is debug-signed, so it upgrades over a
          previous install made by the same CI key; an install signed with a different debug
          key must be uninstalled first.

          A 403 on create-repo / upload is a token problem, not an APK problem: see the
          'Access check' screen (the i in the toolbar) and README 'Why 403'."
          if gh release view apk-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload apk-debug --repo "$GITHUB_REPOSITORY" --clobber GitHubHelper-debug.apk
            gh release edit apk-debug --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create apk-debug --repo "$GITHUB_REPOSITORY" --title "Debug APK (rolling)" \
              --prerelease --notes "$notes" GitHubHelper-debug.apk
          fi
          echo "Installed from: https://github.com/$GITHUB_REPOSITORY/releases/download/apk-debug/GitHubHelper-debug.apk"

      - name: Lint
        run: |
          log="$RUNNER_TEMP/lintDebug.log"
          if ./gradlew lintDebug --stacktrace > "$log" 2>&1; then
            tail -n 15 "$log"
          else
            echo "::error title=lintDebug::lintDebug FAILED"
            {
              first=$(grep -n -m1 -E "^e: |^w: " "$log" | cut -d: -f1)
              [ -n "$first" ] && sed -n "${first},$((first + 45))p" "$log"
              banner=$(grep -n -m1 -E "What went wrong|^FAILURE:|Lint found" "$log" | cut -d: -f1)
              [ -n "$banner" ] && sed -n "${banner},$((banner + 12))p" "$log"
            } | grep -v '^[[:space:]]*$' | head -50 | while IFS= read -r line; do
              echo "::error title=lintDebug::${line}"
            done
            exit 1
          fi

      # Always published so a red build can be diagnosed from the artifacts
      # alone, without digging through the job log.
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            ${{ runner.temp }}/assembleDebug.log
            ${{ runner.temp }}/lintDebug.log
            app/build/reports/lint-results-*
          if-no-files-found: ignore